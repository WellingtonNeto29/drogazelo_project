{% extends 'base.html' %}
{% load static %}

{% block conteudo %}
<div class mesmo="container mt-4">

    <h2 class="mb-4">📦 Finalizar Pedido</h2>

    <!-- Mensagem de previsão -->
    <div class="alert alert-info">
        ⏱️ <strong>Previsão de entrega:</strong> entre <strong>1 a 2 horas</strong>.
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Endereço de entrega</label>
            <textarea name="endereco" class="form-control" rows="3" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Telefone</label>
            <input type="text" name="telefone" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Método de pagamento</label>
            <select name="metodo_pagamento" class="form-select" required>
                <option value="">Selecione</option>
                <option value="pix">Pix</option>
                <option value="cartao">Cartão de crédito</option>
                <option value="boleto">Boleto</option>
                <option value="dinheiro">Dinheiro</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success btn-lg">
            ✅ Confirmar Pedido
        </button>
    </form>

</div>
{% endblock %}
